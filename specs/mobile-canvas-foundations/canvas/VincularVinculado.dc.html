<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Dispositivo GPS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#107148;text-decoration:none}a:hover{color:#0B5C3A}
.pt{--bg:#FFFFFF;--fg:#0D1117;--surface:#FFFFFF;--surface2:#F0FBF6;--default:#F5F6F8;--muted:#667085;--border:rgba(13,17,23,0.08);--lip-gray:#E4E7EC;--accent:#178255;--accent-strong:#107148;--lip:#0E5E3C;--blue:#EFF6FF;--blue-s:#0768E0;--amber:#FFF7ED;--amber-s:#A55E07;--green:#F0FBF6;--green-s:#107148;--violet:#F5F3FF;--violet-s:#7549F7;--rose:#FFF0F3;--rose-s:#D80B34;--danger:#D92D20;--warning:#B54708;--glass:rgba(255,255,255,0.86);--pill:rgba(23,130,85,0.14);--shadow:0 1px 2px rgba(13,17,23,0.04),0 8px 24px rgba(13,17,23,0.06)}
.pt.dark{--bg:#0D1117;--fg:#F7F8FA;--surface:#161B22;--surface2:#12231B;--default:#1F242B;--muted:#9CA3AF;--border:rgba(255,255,255,0.08);--lip-gray:#0A0D12;--accent-strong:#2AB87C;--lip:#0B4D31;--blue:#0B203A;--blue-s:#4A8DDF;--amber:#271E14;--amber-s:#C17B22;--green:#12231B;--green-s:#2AB87C;--violet:#221C33;--violet-s:#9579E7;--rose:#39131A;--rose-s:#E35E78;--danger:#F87171;--warning:#FBBF24;--glass:rgba(22,27,34,0.86);--pill:rgba(23,130,85,0.22);--shadow:0 1px 2px rgba(0,0,0,0.4)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes ping{0%{transform:scale(.55);opacity:.55}100%{transform:scale(1.5);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fill{from{width:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(760px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.pt.dark .dng{color:var(--bg)!important}
</style>
</helmet>
<div class="pt {{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: var(--bg); color: var(--fg); font-family: Inter, 'Helvetica Neue', system-ui, sans-serif; padding: 56px 20px 40px; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; align-items: center; gap: 8px">
<a href="Perfil.dc.html" aria-label="Volver" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: var(--fg)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
<div style="flex: 1"></div>
<a href="VincularVinculado.dc.html" aria-current="true" style="width: 36px; height: 36px; border-radius: 50%; background: var(--amber); color: var(--amber-s); box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; text-decoration: none">R</a>
</header>
<h1 style="margin: 8px 0 0; font-size: 28px; font-weight: 900; letter-spacing: -0.02em; animation: rise 400ms ease-out both">Dispositivo GPS</h1>
<section data-testid="device-status-card" style="border-radius: 22px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 18px 16px; display: flex; flex-direction: column; gap: 16px; animation: rise 400ms ease-out 80ms both">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px"><span style="font-size: 14px; color: var(--muted)">Modelo</span><span style="font-size: 15px; font-weight: 800; color: var(--fg); text-align: right">Pet Tracker 4G</span></div>
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px"><span style="font-size: 14px; color: var(--muted)">Batería</span><span style="font-size: 15px; font-weight: 800; color: var(--accent-strong); text-align: right">72%</span></div>
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px"><span style="font-size: 14px; color: var(--muted)">Conexión</span><span style="font-size: 15px; font-weight: 800; color: var(--accent-strong); text-align: right">En línea</span></div>
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px"><span style="font-size: 14px; color: var(--muted)">Último mensaje</span><span style="font-size: 15px; font-weight: 800; color: var(--fg); text-align: right">21/10/2026, 9:42:10</span></div>
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px"><span style="font-size: 14px; color: var(--muted)">ESN</span><span style="font-family: 'SFMono-Regular', ui-monospace, monospace; letter-spacing: .04em; font-size: 15px; font-weight: 800; color: var(--fg); text-align: right">0-2748193</span></div>
</section>
<span style="align-self: flex-start; display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 36px; border-radius: 999px; background: var(--pill); color: var(--accent-strong); font-size: 14px; font-weight: 700; animation: rise 400ms ease-out 140ms both"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--accent)"></span>Rastreo GPS activo</span>
<a class="dng" href="VincularDesvincular.dc.html" data-testid="device-unpair" style="margin-top: auto; height: 54px; box-sizing: border-box; border: 0; border-radius: 16px; background: var(--danger); color: #FFFFFF; box-shadow: 0 4px 0 #9F1F15; font: 800 16px Inter, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; text-decoration: none">Desvincular collar</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.dark ? "dark" : "" };
}
}
</script>
</body>
</html>
