<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Detalle de alerta</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#107148;text-decoration:none}a:hover{color:#0B5C3A}
.pt{--bg:#FFFFFF;--fg:#0D1117;--surface:#FFFFFF;--surface2:#F0FBF6;--default:#F5F6F8;--muted:#667085;--border:rgba(13,17,23,0.08);--lip-gray:#E4E7EC;--accent:#178255;--accent-strong:#107148;--lip:#0E5E3C;--blue:#EFF6FF;--blue-s:#0768E0;--amber:#FFF7ED;--amber-s:#A55E07;--green:#F0FBF6;--green-s:#107148;--violet:#F5F3FF;--violet-s:#7549F7;--rose:#FFF0F3;--rose-s:#D80B34;--danger:#D92D20;--warning:#B54708;--glass:rgba(255,255,255,0.86);--pill:rgba(23,130,85,0.14);--shadow:0 1px 2px rgba(13,17,23,0.04),0 8px 24px rgba(13,17,23,0.06)}
.pt.dark{--bg:#0D1117;--fg:#F7F8FA;--surface:#161B22;--surface2:#12231B;--default:#1F242B;--muted:#9CA3AF;--border:rgba(255,255,255,0.08);--lip-gray:#0A0D12;--accent-strong:#2AB87C;--lip:#0B4D31;--blue:#0B203A;--blue-s:#4A8DDF;--amber:#271E14;--amber-s:#C17B22;--green:#12231B;--green-s:#2AB87C;--violet:#221C33;--violet-s:#9579E7;--rose:#39131A;--rose-s:#E35E78;--danger:#F87171;--warning:#FBBF24;--glass:rgba(22,27,34,0.86);--pill:rgba(23,130,85,0.22);--shadow:0 1px 2px rgba(0,0,0,0.4)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes ping{0%{transform:scale(.55);opacity:.55}100%{transform:scale(1.5);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fill{from{width:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(760px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div class="pt {{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: var(--bg); color: var(--fg); font-family: Inter, 'Helvetica Neue', system-ui, sans-serif; padding: 56px 20px 40px; display: flex; flex-direction: column; gap: 14px">
<header style="display: flex; align-items: center; gap: 8px">
<a href="Alertas.dc.html" aria-label="Volver" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: var(--fg)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.02em">Alerta</h1>
</header>
<section style="border-radius: 28px; background: var(--rose); padding: 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; animation: rise 400ms ease-out both">
<span style="position: relative; width: 72px; height: 72px">
<span style="position: absolute; inset: -10px; border-radius: 50%; background: rgba(217,45,32,0.18); animation: ping 1.8s ease-out infinite"></span>
<span style="position: absolute; inset: 0; border-radius: 50%; background: var(--danger); color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"></path><path d="M9 10h6"></path></svg></span>
</span>
<span style="padding: 3px 10px; border-radius: 999px; background: var(--danger); color: #FFFFFF; font-size: 12px; font-weight: 800">Sin leer</span>
<span style="font-size: 22px; font-weight: 900">Salió de la zona</span>
<span style="font-size: 15px; font-weight: 700; color: var(--rose-s)">Rocky</span>
<span style="font-size: 13px; color: var(--rose-s)">Detectada el 6 oct 2026, 16:42</span>
</section>
<section style="height: 210px; border-radius: 24px; overflow: hidden; position: relative; animation: rise 400ms ease-out 80ms both">
<svg width="100%" height="210" viewBox="0 0 350 210" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ubicación al salir de la zona Casa"><rect width="350" height="210" fill="#EEF2EC"></rect><g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"><path d="M-10 70 L360 40"></path><path d="M90 -10 L120 220"></path><path d="M-10 160 L360 140"></path><path d="M250 -10 L270 220"></path></g><circle cx="140" cy="100" r="62" fill="rgba(23,130,85,0.12)" stroke="#107148" stroke-width="2" stroke-dasharray="6 5"></circle><path d="M140 100 C170 104 200 120 232 128" fill="none" stroke="#D92D20" stroke-width="4" stroke-linecap="round"></path><circle cx="232" cy="128" r="11" fill="#D92D20" stroke="#FFFFFF" stroke-width="3"></circle></svg>
<span style="position: absolute; left: 12px; bottom: 12px; padding: 6px 10px; border-radius: 999px; background: var(--glass); backdrop-filter: blur(12px); font-size: 12px; font-weight: 700">A 85 m de Casa</span>
</section>
<a href="Mapa.dc.html" style="height: 52px; border-radius: 16px; background: var(--surface); border: 2px solid var(--lip-gray); box-shadow: 0 4px 0 var(--lip-gray); color: var(--fg); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 800; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"></path><path d="M9 4v14M15 6v14"></path></svg>Ver en el mapa</a>
<a href="Alertas.dc.html" style="margin-top: auto; height: 56px; border-radius: 16px; background: var(--accent); color: #FFFFFF; box-shadow: 0 4px 0 var(--lip); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; text-decoration: none">Marcar leída</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
