<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Nueva mascota, paso 2</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#107148;text-decoration:none}a:hover{color:#0B5C3A}
.pt{--bg:#FFFFFF;--fg:#0D1117;--surface:#FFFFFF;--surface2:#F0FBF6;--default:#F5F6F8;--muted:#667085;--border:rgba(13,17,23,0.08);--lip-gray:#E4E7EC;--accent:#178255;--accent-strong:#107148;--lip:#0E5E3C;--blue:#EFF6FF;--blue-s:#0768E0;--amber:#FFF7ED;--amber-s:#A55E07;--green:#F0FBF6;--green-s:#107148;--violet:#F5F3FF;--violet-s:#7549F7;--rose:#FFF0F3;--rose-s:#D80B34;--danger:#D92D20;--warning:#B54708;--glass:rgba(255,255,255,0.86);--pill:rgba(23,130,85,0.14);--shadow:0 1px 2px rgba(13,17,23,0.04),0 8px 24px rgba(13,17,23,0.06)}
.pt.dark{--bg:#0D1117;--fg:#F7F8FA;--surface:#161B22;--surface2:#12231B;--default:#1F242B;--muted:#9CA3AF;--border:rgba(255,255,255,0.08);--lip-gray:#0A0D12;--accent-strong:#2AB87C;--lip:#0B4D31;--blue:#0B203A;--blue-s:#4A8DDF;--amber:#271E14;--amber-s:#C17B22;--green:#12231B;--green-s:#2AB87C;--violet:#221C33;--violet-s:#9579E7;--rose:#39131A;--rose-s:#E35E78;--danger:#F87171;--warning:#FBBF24;--glass:rgba(22,27,34,0.86);--pill:rgba(23,130,85,0.22);--shadow:0 1px 2px rgba(0,0,0,0.4)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes ping{0%{transform:scale(.55);opacity:.55}100%{transform:scale(1.5);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fill{from{width:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(760px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div class="pt {{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: var(--bg); color: var(--fg); font-family: Inter, 'Helvetica Neue', system-ui, sans-serif; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 16px">
<header style="display: flex; align-items: center; gap: 8px">
<a href="NuevaMascota.dc.html" aria-label="Volver" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: var(--fg)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="flex: 1; margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -0.02em">Nueva mascota</h1>
<span style="font-size: 13px; font-weight: 800; color: var(--muted)">2 de 2</span>
</header>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px"><span style="height: 6px; border-radius: 3px; background: var(--accent)"></span><span style="height: 6px; border-radius: 3px; background: var(--accent)"></span></div>
<h2 style="margin: 12px 0 0; font-size: 18px; font-weight: 900; animation: rise 400ms ease-out both">Datos médicos</h2>
<div style="display: flex; flex-direction: column; gap: 8px; animation: rise 400ms ease-out 60ms both">
<span style="font-size: 13px; font-weight: 800">Edad</span>
<div style="display: flex; gap: 8px"><button type="button" aria-pressed="true" style="height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 1px solid var(--accent); background: var(--pill); font-weight: 700; color: var(--fg); font-family: Inter, system-ui, sans-serif; font-size: 14px">Fecha de nacimiento</button><button type="button" aria-pressed="false" style="height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--default); font-weight: 600; color: var(--fg); font-family: Inter, system-ui, sans-serif; font-size: 14px">Meses aprox.</button></div>
<div style="height: 48px; box-sizing: border-box; border-radius: 12px; background: var(--default); border: 2px solid transparent; padding: 0 14px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" style="color: var(--muted); flex: none"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 11h18"></path></svg>15/3/2022</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; animation: rise 400ms ease-out 120ms both">
<span style="font-size: 13px; font-weight: 800">Esterilizado/a</span>
<div style="display: flex; gap: 8px"><button type="button" aria-pressed="true" style="height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 1px solid var(--accent); background: var(--pill); font-weight: 700; color: var(--fg); font-family: Inter, system-ui, sans-serif; font-size: 14px">Sí</button><button type="button" aria-pressed="false" style="height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--default); font-weight: 600; color: var(--fg); font-family: Inter, system-ui, sans-serif; font-size: 14px">No</button></div>
</div>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 800; animation: rise 400ms ease-out 180ms both">Microchip<input placeholder="Opcional" style="height: 48px; border-radius: 12px; background: var(--default); border: 2px solid transparent; padding: 0 14px; font: 600 15px Inter, system-ui, sans-serif; color: var(--fg)"></label>
<div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 20px 34px; background: var(--bg); box-shadow: 0 -10px 20px var(--bg)">
<a href="Perfil.dc.html" style="height: 56px; border-radius: 16px; background: var(--accent); color: #FFFFFF; box-shadow: 0 4px 0 var(--lip); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; text-decoration: none">Guardar mascota</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.dark ? "dark" : "" };
}
}
</script>
</body>
</html>
