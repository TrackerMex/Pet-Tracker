<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Peso registrado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#107148;text-decoration:none}a:hover{color:#0B5C3A}
.pt{--bg:#FFFFFF;--fg:#0D1117;--surface:#FFFFFF;--surface2:#F0FBF6;--default:#F5F6F8;--muted:#667085;--border:rgba(13,17,23,0.08);--lip-gray:#E4E7EC;--accent:#178255;--accent-strong:#107148;--lip:#0E5E3C;--blue:#EFF6FF;--blue-s:#0768E0;--amber:#FFF7ED;--amber-s:#A55E07;--green:#F0FBF6;--green-s:#107148;--violet:#F5F3FF;--violet-s:#7549F7;--rose:#FFF0F3;--rose-s:#D80B34;--danger:#D92D20;--warning:#B54708;--glass:rgba(255,255,255,0.86);--pill:rgba(23,130,85,0.14);--shadow:0 1px 2px rgba(13,17,23,0.04),0 8px 24px rgba(13,17,23,0.06)}
.pt.dark{--bg:#0D1117;--fg:#F7F8FA;--surface:#161B22;--surface2:#12231B;--default:#1F242B;--muted:#9CA3AF;--border:rgba(255,255,255,0.08);--lip-gray:#0A0D12;--accent-strong:#2AB87C;--lip:#0B4D31;--blue:#0B203A;--blue-s:#4A8DDF;--amber:#271E14;--amber-s:#C17B22;--green:#12231B;--green-s:#2AB87C;--violet:#221C33;--violet-s:#9579E7;--rose:#39131A;--rose-s:#E35E78;--danger:#F87171;--warning:#FBBF24;--glass:rgba(22,27,34,0.86);--pill:rgba(23,130,85,0.22);--shadow:0 1px 2px rgba(0,0,0,0.4)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes ping{0%{transform:scale(.55);opacity:.55}100%{transform:scale(1.5);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fill{from{width:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(760px) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div class="pt {{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: var(--bg); color: var(--fg); font-family: Inter, 'Helvetica Neue', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 14px">
<header style="display: flex; align-items: center; gap: 8px">
<a href="Salud.dc.html" aria-label="Volver" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: var(--fg)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -0.02em">Registro de peso</h1>
</header>
<section style="border-radius: 24px; background: var(--surface2); padding: 16px; display: flex; flex-direction: column; gap: 8px; animation: rise 400ms ease-out both">
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 34px; font-weight: 900">12.6 kg</span><span style="font-size: 14px; font-weight: 800; color: var(--danger)">+0.5 kg este mes</span></div>
<svg width="100%" height="110" viewBox="0 0 310 110" preserveAspectRatio="none" role="img" aria-label="Peso de los últimos 6 meses"><g stroke="var(--border)" stroke-width="1"><path d="M0 20H310M0 55H310M0 90H310"></path></g><path d="M0 80 L62 74 L124 78 L186 60 L248 52 L310 34 L310 110 L0 110Z" fill="var(--pill)"></path><path d="M0 80 L62 74 L124 78 L186 60 L248 52 L310 34" fill="none" stroke="var(--accent-strong)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="420" style="animation: draw 1200ms ease-out 200ms both"></path><circle cx="310" cy="34" r="5" fill="var(--accent-strong)" style="animation: pop 400ms ease-out 1300ms both"></circle></svg>
<div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--muted)"><span>may</span><span>jun</span><span>jul</span><span>ago</span><span>sep</span><span>oct</span></div>
</section>
<form style="border-radius: 24px; background: var(--surface); border: 1px solid var(--border); padding: 14px; display: flex; flex-direction: column; gap: 10px; animation: rise 400ms ease-out 80ms both">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 800">Peso<input inputmode="decimal" placeholder="Peso (kg)" style="width: 100%; min-width: 0; box-sizing: border-box; height: 48px; border-radius: 12px; background: var(--default); border: 2px solid transparent; padding: 0 12px; font: 600 15px Inter, system-ui, sans-serif; color: var(--fg)"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 800">Fecha de medición<input placeholder="AAAA-MM-DD" style="width: 100%; min-width: 0; box-sizing: border-box; height: 48px; border-radius: 12px; background: var(--default); border: 2px solid transparent; padding: 0 12px; font: 600 15px Inter, system-ui, sans-serif; color: var(--fg)"></label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 800">Condición corporal<input placeholder="Condición corporal 1-9 (opcional)" style="width: 100%; box-sizing: border-box; height: 48px; border-radius: 12px; background: var(--default); border: 2px solid transparent; padding: 0 12px; font: 600 15px Inter, system-ui, sans-serif; color: var(--fg)"></label>
<button type="button" style="height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: #FFFFFF; box-shadow: 0 4px 0 var(--lip); font: 800 16px Inter, system-ui, sans-serif">Registrar peso</button>
</form>
<section style="display: flex; flex-direction: column">
<h2 style="margin: 0 0 4px; font-size: 17px; font-weight: 800">Historial</h2>
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); animation: rise 400ms ease-out 140ms both"><span style="width: 36px; height: 36px; border-radius: 12px; background: var(--rose); color: var(--danger); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m7 17 10-10M9 7h8v8"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800">12.6 kg <span style="font-size: 13px; color: var(--danger)">+0.2 kg</span></span></span><span style="font-size: 13px; font-weight: 600; color: var(--muted)">21 oct</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); animation: rise 400ms ease-out 200ms both"><span style="width: 36px; height: 36px; border-radius: 12px; background: var(--rose); color: var(--danger); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m7 17 10-10M9 7h8v8"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800">12.4 kg <span style="font-size: 13px; color: var(--danger)">+0.3 kg</span></span><span style="font-size: 12px; color: var(--muted)">CC 5/9</span></span><span style="font-size: 13px; font-weight: 600; color: var(--muted)">1 oct</span></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); animation: rise 400ms ease-out 260ms both"><span style="width: 36px; height: 36px; border-radius: 12px; background: var(--green); color: var(--accent-strong); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m7 7 10 10M17 9v8H9"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800">12.1 kg <span style="font-size: 13px; color: var(--accent-strong)">−0.2 kg</span></span><span style="font-size: 12px; color: var(--muted)">CC 5/9</span></span><span style="font-size: 13px; font-weight: 600; color: var(--muted)">1 sep</span></div>
</section>
<div role="status" aria-live="polite" style="position: absolute; top: 98px; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; animation: fade 300ms ease-out 400ms both"><span style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(13,17,23,0.10); font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent-strong)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>Anotado. Ya lo puse en la gráfica.</span></div>
<style>@keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}@keyframes fade{from{opacity:0}to{opacity:1}}</style>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.dark ? "dark" : "" };
}
}
</script>
</body>
</html>
