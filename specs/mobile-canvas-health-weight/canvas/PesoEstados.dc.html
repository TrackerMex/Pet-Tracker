<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Peso, estados</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0}
a{color:#107148;text-decoration:none}a:hover{color:#0B5C3A}
.pt{--bg:#FFFFFF;--fg:#0D1117;--surface:#FFFFFF;--surface2:#F0FBF6;--default:#F5F6F8;--muted:#667085;--border:rgba(13,17,23,0.08);--lip-gray:#E4E7EC;--accent:#178255;--accent-strong:#107148;--lip:#0E5E3C;--blue:#EFF6FF;--blue-s:#0768E0;--amber:#FFF7ED;--amber-s:#A55E07;--green:#F0FBF6;--green-s:#107148;--violet:#F5F3FF;--violet-s:#7549F7;--rose:#FFF0F3;--rose-s:#D80B34;--danger:#D92D20;--warning:#B54708;--glass:rgba(255,255,255,0.86);--pill:rgba(23,130,85,0.14);--shadow:0 1px 2px rgba(13,17,23,0.04),0 8px 24px rgba(13,17,23,0.06)}
.pt.dark{--bg:#0D1117;--fg:#F7F8FA;--surface:#161B22;--surface2:#12231B;--default:#1F242B;--muted:#9CA3AF;--border:rgba(255,255,255,0.08);--lip-gray:#0A0D12;--accent-strong:#2AB87C;--lip:#0B4D31;--blue:#0B203A;--blue-s:#4A8DDF;--amber:#271E14;--amber-s:#C17B22;--green:#12231B;--green-s:#2AB87C;--violet:#221C33;--violet-s:#9579E7;--rose:#39131A;--rose-s:#E35E78;--danger:#F87171;--warning:#FBBF24;--glass:rgba(22,27,34,0.86);--pill:rgba(23,130,85,0.22);--shadow:0 1px 2px rgba(0,0,0,0.4)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes ping{0%{transform:scale(.55);opacity:.55}100%{transform:scale(1.5);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fill{from{width:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(760px) rotate(540deg);opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</helmet>
<div class="pt {{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: var(--bg); color: var(--fg); font-family: Inter, 'Helvetica Neue', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 14px">
<header style="display: flex; align-items: center; gap: 8px">
<a href="Salud.dc.html" aria-label="Volver" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: var(--fg)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a>
<h1 style="margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -0.02em">Registro de peso</h1>
</header>
<form style="border-radius: 24px; background: var(--surface); border: 1px solid var(--border); padding: 14px; display: flex; flex-direction: column; gap: 10px; animation: rise 400ms ease-out 80ms both">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 800">Peso<input inputmode="decimal" placeholder="Peso (kg)" style="width: 100%; min-width: 0; box-sizing: border-box; height: 48px; border-radius: 12px; background: var(--default); border: 2px solid transparent; padding: 0 12px; font: 600 15px Inter, system-ui, sans-serif; color: var(--fg)"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 800">Fecha de medición<input placeholder="AAAA-MM-DD" style="width: 100%; min-width: 0; box-sizing: border-box; height: 48px; border-radius: 12px; background: var(--default); border: 2px solid transparent; padding: 0 12px; font: 600 15px Inter, system-ui, sans-serif; color: var(--fg)"></label>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 800">Condición corporal<input placeholder="Condición corporal 1-9 (opcional)" style="width: 100%; box-sizing: border-box; height: 48px; border-radius: 12px; background: var(--default); border: 2px solid transparent; padding: 0 12px; font: 600 15px Inter, system-ui, sans-serif; color: var(--fg)"></label>
<button type="button" style="height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: #FFFFFF; box-shadow: 0 4px 0 var(--lip); font: 800 16px Inter, system-ui, sans-serif">Registrar peso</button>
</form>
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted)">Cargando</span><div role="status" aria-busy="true" aria-label="Cargando registros" style="display: flex; flex-direction: column"><div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); animation: rise 400ms ease-out 0ms both"><span style="display: block; width: 36px; height: 36px; border-radius: 12px; background: var(--default); animation: pulse 1.4s ease-in-out infinite; flex: none"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 6px"><span style="display: block; width: 40%; height: 14px; border-radius: 7px; background: var(--default); animation: pulse 1.4s ease-in-out infinite; flex: none"></span><span style="display: block; width: 22%; height: 10px; border-radius: 5px; background: var(--default); animation: pulse 1.4s ease-in-out infinite; flex: none"></span></span><span style="display: block; width: 38px; height: 12px; border-radius: 6px; background: var(--default); animation: pulse 1.4s ease-in-out infinite; flex: none"></span></div><div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); animation: rise 400ms ease-out 60ms both"><span style="display: block; width: 36px; height: 36px; border-radius: 12px; background: var(--default); animation: pulse 1.4s ease-in-out infinite; flex: none"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 6px"><span style="display: block; width: 40%; height: 14px; border-radius: 7px; background: var(--default); animation: pulse 1.4s ease-in-out infinite; flex: none"></span><span style="display: block; width: 22%; height: 10px; border-radius: 5px; background: var(--default); animation: pulse 1.4s ease-in-out infinite; flex: none"></span></span><span style="display: block; width: 38px; height: 12px; border-radius: 6px; background: var(--default); animation: pulse 1.4s ease-in-out infinite; flex: none"></span></div><div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); animation: rise 400ms ease-out 120ms both"><span style="display: block; width: 36px; height: 36px; border-radius: 12px; background: var(--default); animation: pulse 1.4s ease-in-out infinite; flex: none"></span><span style="flex: 1; display: flex; flex-direction: column; gap: 6px"><span style="display: block; width: 40%; height: 14px; border-radius: 7px; background: var(--default); animation: pulse 1.4s ease-in-out infinite; flex: none"></span><span style="display: block; width: 22%; height: 10px; border-radius: 5px; background: var(--default); animation: pulse 1.4s ease-in-out infinite; flex: none"></span></span><span style="display: block; width: 38px; height: 12px; border-radius: 6px; background: var(--default); animation: pulse 1.4s ease-in-out infinite; flex: none"></span></div></div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted)">Sin registros</span><p style="margin: 0; font-size: 15px; line-height: 1.4; color: var(--muted)">Aún no hay registros de peso</p></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted)">Error</span><div style="display: flex; flex-direction: column; align-items: flex-start; gap: 12px"><p role="alert" style="margin: 0; font-size: 15px; line-height: 1.4; color: var(--danger)">Algo salió mal</p><button type="button" style="align-self: flex-start; height: 44px; padding: 0 20px; border: 0; border-radius: 14px; background: var(--accent); color: #FFFFFF; box-shadow: 0 4px 0 var(--lip); font: 800 15px Inter, system-ui, sans-serif">Reintentar</button></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.dark ? "dark" : "" };
}
}
</script>
</body>
</html>
