<style>
body{margin:0}
a{color:#107148;text-decoration:none}a:hover{color:#0B5C3A}
.pt{--bg:#FFFFFF;--fg:#0D1117;--surface:#FFFFFF;--surface2:#F0FBF6;--default:#F5F6F8;--muted:#667085;--border:rgba(13,17,23,0.08);--lip-gray:#E4E7EC;--accent:#178255;--accent-strong:#107148;--lip:#0E5E3C;--blue:#EFF6FF;--blue-s:#0768E0;--amber:#FFF7ED;--amber-s:#A55E07;--green:#F0FBF6;--green-s:#107148;--violet:#F5F3FF;--violet-s:#7549F7;--rose:#FFF0F3;--rose-s:#D80B34;--danger:#D92D20;--warning:#B54708;--glass:rgba(255,255,255,0.86);--pill:rgba(23,130,85,0.14);--shadow:0 1px 2px rgba(13,17,23,0.04),0 8px 24px rgba(13,17,23,0.06)}
.pt.dark{--bg:#0D1117;--fg:#F7F8FA;--surface:#161B22;--surface2:#12231B;--default:#1F242B;--muted:#9CA3AF;--border:rgba(255,255,255,0.08);--lip-gray:#0A0D12;--accent-strong:#2AB87C;--lip:#0B4D31;--blue:#0B203A;--blue-s:#4A8DDF;--amber:#271E14;--amber-s:#C17B22;--green:#12231B;--green-s:#2AB87C;--violet:#221C33;--violet-s:#9579E7;--rose:#39131A;--rose-s:#E35E78;--danger:#F87171;--warning:#FBBF24;--glass:rgba(22,27,34,0.86);--pill:rgba(23,130,85,0.22);--shadow:0 1px 2px rgba(0,0,0,0.4)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.list{border-radius: 20px; background: var(--surface); border: 1px solid var(--border); padding: 2px 14px; animation: rise 400ms ease-out both}
.row{display: flex; align-items: center; gap: 12px; min-height: 60px}
.row + .row{border-top: 1px solid var(--border)}
.av{width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; flex: none}
.who{flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px}
.nm{font-size: 15px; font-weight: 800}
.sub{font-size: 12px; font-weight: 600; color: var(--muted)}
.role{padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 800; flex: none}
</style>
</helmet>
<div class="pt {{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; position: relative; background: var(--bg); color: var(--fg); font-family: Inter, 'Helvetica Neue', system-ui, sans-serif; padding: 56px 20px 32px; display: flex; flex-direction: column; gap: 12px">
<header style="display: flex; align-items: center; gap: 8px"><a href="Perfil.dc.html" aria-label="Volver" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center; color: var(--fg)"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg></a><h1 style="flex: 1; margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.02em">Familia de Luna</h1><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: var(--amber); color: var(--amber-s); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 900">L</span></header>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted)">Ves a Luna y recibes sus avisos porque formas parte de su familia.</p>
<h2 style="margin: 4px 0 0; font-size: 16px; font-weight: 900">Miembros</h2>
<div class="list">
<div class="row"><span class="av" style="background: var(--violet); color: var(--violet-s)">MR</span><span class="who"><span class="nm">Marta Ruiz</span></span><span class="role" style="background: var(--green); color: var(--green-s)">Dueño</span></div>
<div class="row"><span class="av" style="background: var(--default)">AG</span><span class="who"><span class="nm">Ana García</span><span class="sub">Tú</span></span><span class="role" style="background: var(--rose); color: var(--rose-s)">Familia</span></div>
</div>
<div role="note" style="border-radius: 18px; background: var(--default); padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-size: 13px; font-weight: 600; line-height: 1.4; animation: rise 400ms ease-out 60ms both"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg><span>Marta Ruiz administra a Luna. Solo ella puede invitar o quitar personas.</span></div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; text-align: center; font-size: 13px; font-weight: 600; line-height: 1.4; color: var(--muted)">Si sales, dejarás de ver a Luna y de recibir sus avisos.</p>
<button type="button" style="height: 54px; box-sizing: border-box; border-radius: 16px; background: var(--surface); border: 2px solid var(--danger); box-shadow: 0 4px 0 var(--lip-gray); color: var(--danger); display: flex; align-items: center; justify-content: center; gap: 8px; font: 800 16px Inter, system-ui, sans-serif"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>Salir de esta mascota</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
